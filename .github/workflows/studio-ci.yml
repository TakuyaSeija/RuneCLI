name: Studio CI

on:
  push:
    branches: [main, crossplatform]
  pull_request:
    branches: [main]
  workflow_dispatch:

# No write token, deployment, live credentials, or pull_request_target.
permissions:
  contents: read

concurrency:
  group: studio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust quality gate (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    defaults:
      run:
        shell: bash
        working-directory: .
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      - name: Check out source
        # actions/checkout v6.1.0; immutable revision, no saved Git credential.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Check repository file policy
        run: python3 scripts/check_git_policy.py --check-tracked

      - name: Test repository file policy
        run: python3 -B scripts/test_git_policy.py

      - name: Install Rust tooling
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy

      - name: Prepare isolated test directories
        # A Rune home of the run's own; `runner` is no context of a job's env.
        run: |
          echo "RUNE_HOME=$RUNNER_TEMP/rune-ci-home" >> "$GITHUB_ENV"
          mkdir -p target/test-tmp "$RUNNER_TEMP/rune-ci-home"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --locked --no-fail-fast

      - name: PTY fixtures (the windows in a real terminal)
        if: always()
        timeout-minutes: 40
        run: |
          cargo build --locked -p runecli
          python3 -I Cli/tests/RunPTY.py target/debug/rune

      - name: Install Go for the website
        if: always()
        # actions/setup-go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: Website/go.mod
          cache: false

      - name: Website
        # The site, its catalog and install.sh end to end. (The release signer lives
        # with the host operations, outside the repository, and is tested there.)
        if: always()
        run: |
          (cd Website && go vet ./... && go test -count=1 ./...)

  # The Linux release, as people get it: built for glibc 2.17 (every glibc
  # distribution since 2012) and as one static musl file (Alpine, any Linux
  # without glibc), on x86_64 and aarch64 — then checked for what it asks of
  # the system and run on old and other distributions. Kept as artifacts of
  # the run, never published.
  linux-release:
    name: Linux release (${{ matrix.libc }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04, libc: gnu }
          - { arch: x86_64, runner: ubuntu-24.04, libc: musl }
          - { arch: aarch64, runner: ubuntu-24.04-arm, libc: gnu }
          - { arch: aarch64, runner: ubuntu-24.04-arm, libc: musl }
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        # actions/checkout v6.1.0; immutable revision, no saved Git credential.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Build in the release image
        run: scripts/build_linux_release.sh ${{ matrix.libc }}

      - name: Run on old and other distributions
        run: scripts/smoke_linux_release.sh target/linux-release/${{ matrix.libc }}-${{ matrix.arch }}/release/rune ${{ matrix.libc }}

      - name: Started through the dynamic loader
        if: matrix.libc == 'gnu'
        run: |
          mkdir -p target/test-tmp
          python3 -I Cli/tests/RuneLoaderPTY.py target/linux-release/gnu-${{ matrix.arch }}/release/rune

      - name: Keep the binary
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rune-linux-${{ matrix.libc }}-${{ matrix.arch }}
          path: target/linux-release/${{ matrix.libc }}-${{ matrix.arch }}/release/rune
          if-no-files-found: error
          retention-days: 14

  # The same gate on a real Windows: Windows Server 2025 (Windows 11's
  # kernel), x64. Its binaries — x64 tested, arm64 built — are kept as
  # artifacts of the run, never published.
  windows:
    name: Windows (x64 gate, arm64 build)
    # A commit naming `[ci probe]` runs only the measurement below.
    if: ${{ !contains(github.event.head_commit.message, '[ci probe]') }}
    runs-on: windows-2025
    # A hung test costs the whole limit, twice over in billed minutes.
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      - name: Check out source
        # actions/checkout v6.1.0; immutable revision, no saved Git credential.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install Rust tooling
        run: |
          toolchain="$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy --target aarch64-pc-windows-msvc

      - name: Restore build cache
        # actions/cache v6.1.0 (restore only: saved below even when a test fails)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: windows-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: Prepare isolated test directories
        # Windows reads TMP/TEMP, not TMPDIR: tests keep their folders in
        # target/test-tmp here too.
        run: |
          echo "RUNE_HOME=$RUNNER_TEMP\\rune-ci-home" >> "$GITHUB_ENV"
          mkdir -p target/test-tmp "$(cygpath -u "$RUNNER_TEMP")/rune-ci-home"
          echo "TMP=$(cygpath -w "$PWD/target/test-tmp")" >> "$GITHUB_ENV"
          echo "TEMP=$(cygpath -w "$PWD/target/test-tmp")" >> "$GITHUB_ENV"

      - name: Check lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Set up Rune's sandbox account
        # As a person's first start does: the tests' confinements then run
        # their commands under it, and the sandbox test fails if one does not.
        run: |
          cargo run --locked -p runecli -- -sandbox setup
          echo "RUNE_EXPECT_SANDBOX_ACCOUNT=1" >> "$GITHUB_ENV"

      - name: Test workspace
        # Shorter than the job's limit: a hung test fails this step and its
        # log is kept (libtest names a test running for over 60 seconds).
        timeout-minutes: 40
        run: cargo test --workspace --locked --no-fail-fast

      - name: PTY fixtures (the windows in a real ConPTY)
        # ConPTY is what Windows Terminal hosts a program in; the fixtures
        # open one through the console API (RuneTerminal.py) and psutil finds
        # the hosts they start. A test tool only, in a throwaway environment:
        # nothing of Rune's.
        if: always()
        timeout-minutes: 40
        run: |
          python -m venv "$RUNNER_TEMP/pty"
          "$RUNNER_TEMP/pty/Scripts/python" -m pip install --quiet psutil==7.0.0
          cargo build --locked -p runecli
          "$RUNNER_TEMP/pty/Scripts/python" -I Cli/tests/RunPTY.py target/debug/rune.exe

      - name: Keep failed PTY evidence
        # The windows' raw output and the homes of a failed fixture run: the
        # screen model is checked against what the terminal really sent.
        if: failure()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pty-evidence-windows
          path: |
            target/test-tmp/RuneLiveProvider.*/terminal-*.bin
            target/test-tmp/RuneLiveProvider.*/*.txt
            target/test-tmp/RuneLiveProvider.*/Home/projects/*/sessions/*/*.jsonl
            target/test-tmp/RuneLiveProvider.*/Home/projects/*/scratch/*/stderr.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build release (x64)
        if: always()
        run: |
          cargo build --release --locked -p runecli
          target/release/rune.exe --version

      - name: Build release (arm64)
        if: always()
        continue-on-error: true
        run: cargo build --release --locked -p runecli --target aarch64-pc-windows-msvc

      - name: Save build cache
        if: always()
        # actions/cache v6.1.0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}

      - name: Install Go for the website
        if: always()
        # actions/setup-go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: Website/go.mod
          cache: false

      - name: Website
        # install.ps1 end to end in Windows PowerShell 5.1 and PowerShell 7.
        if: always()
        run: |
          (cd Website && go vet ./... && go test -count=1 ./...)

      - name: Keep the binaries
        if: always()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rune-windows
          path: |
            target/release/rune.exe
            target/aarch64-pc-windows-msvc/release/rune.exe
          if-no-files-found: warn
          retention-days: 14

  # A measurement on a real Windows, asked for by `[ci probe]` in a commit:
  # how real programs (shells, git, Python, Node, cargo) live under each way
  # of confining a command (`platform/windows/probe.rs`). Prints a table;
  # nothing else of the gate runs on Windows for that commit.
  windows-probe:
    name: Windows sandbox probe
    if: ${{ contains(github.event.head_commit.message, '[ci probe]') }}
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      - name: Check out source
        # actions/checkout v6.1.0; immutable revision, no saved Git credential.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install Rust tooling
        run: |
          toolchain="$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal

      - name: Restore build cache
        # actions/cache v6.1.0 (restore only: the gate's cache is reused, never saved here)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: windows-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: Prepare isolated test directories
        run: |
          echo "RUNE_HOME=$RUNNER_TEMP\\rune-ci-home" >> "$GITHUB_ENV"
          mkdir -p target/test-tmp "$(cygpath -u "$RUNNER_TEMP")/rune-ci-home"

      - name: Make a local account for the probe
        # A second account of this disposable machine, for the candidates
        # that run commands as an account of Rune's own; its password lives
        # in this job only and is masked in the log.
        continue-on-error: true
        shell: pwsh
        run: |
          # Letters and digits only: nothing a shell or the env file reads
          # as anything else.
          $bytes = New-Object byte[] 16
          [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $pw = 'Rp' + [Convert]::ToHexString($bytes) + 'x9'
          Write-Output "::add-mask::$pw"
          New-LocalUser -Name runeprobe -Password (ConvertTo-SecureString $pw -AsPlainText -Force) -PasswordNeverExpires -AccountNeverExpires | Out-Null
          Add-Content $env:GITHUB_ENV "RUNE_PROBE_USER=runeprobe"
          Add-Content $env:GITHUB_ENV "RUNE_PROBE_PASSWORD=$pw"
          # The logon the probe makes, tried once here: a refusal is said now.
          $cred = New-Object System.Management.Automation.PSCredential('runeprobe', (ConvertTo-SecureString $pw -AsPlainText -Force))
          Start-Process -FilePath cmd.exe -ArgumentList '/c','exit 0' -Credential $cred -Wait -NoNewWindow -LoadUserProfile
          Write-Output "logon as runeprobe: ok"

      - name: Probe
        timeout-minutes: 30
        run: cargo test -p runeengine --lib --locked platform::windows::probe -- --ignored --nocapture

  # The same gate on a real macOS: macOS 14 on Apple silicon; the Intel
  # build made beside it. A run on the port branch asks for it by naming
  # `[ci macos]` in its commit (macOS minutes cost ten times Linux's).
  macos:
    name: macOS (arm64 gate, x64 build)
    if: github.ref != 'refs/heads/crossplatform' || contains(github.event.head_commit.message, '[ci macos]')
    runs-on: macos-15
    # Billed ten times over: a hung test must not run long (its step stops
    # at 30 minutes; the rest is building).
    timeout-minutes: 110
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - name: Check out source
        # actions/checkout v6.1.0; immutable revision, no saved Git credential.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install Rust tooling
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy --target x86_64-apple-darwin

      - name: Restore build cache
        # actions/cache v6.1.0 (restore only: saved below even when a test fails)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: macos-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: macos-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      - name: Prepare isolated test directories
        # A Rune home of the run's own; `runner` is no context of a job's env.
        run: |
          echo "RUNE_HOME=$RUNNER_TEMP/rune-ci-home" >> "$GITHUB_ENV"
          mkdir -p target/test-tmp "$RUNNER_TEMP/rune-ci-home"

      - name: Check lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test workspace
        # Shorter than the job's limit: a hung test fails this step and its
        # log is kept (libtest names a test running for over 60 seconds).
        timeout-minutes: 30
        run: cargo test --workspace --locked --no-fail-fast

      - name: PTY fixtures (the windows in a real terminal)
        # psutil finds the hosts the fixtures start (macOS has no /proc):
        # a test tool, in a throwaway environment.
        if: always()
        timeout-minutes: 40
        run: |
          python3 -m venv "$RUNNER_TEMP/pty"
          "$RUNNER_TEMP/pty/bin/python" -m pip install --quiet psutil==7.0.0
          cargo build --locked -p runecli
          "$RUNNER_TEMP/pty/bin/python" -I Cli/tests/RunPTY.py target/debug/rune

      - name: Keep failed PTY evidence
        # The windows' raw output and the homes of a failed fixture run: the
        # screen model is checked against what the terminal really sent.
        if: failure()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pty-evidence-macos
          path: |
            target/test-tmp/RuneLiveProvider.*/terminal-*.bin
            target/test-tmp/RuneLiveProvider.*/*.txt
            target/test-tmp/RuneLiveProvider.*/Home/projects/*/sessions/*/*.jsonl
            target/test-tmp/RuneLiveProvider.*/Home/projects/*/scratch/*/stderr.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build release (arm64, x64)
        if: always()
        run: |
          cargo build --release --locked -p runecli
          cargo build --release --locked -p runecli --target x86_64-apple-darwin

      - name: Run the release builds
        # The Apple silicon build natively, the Intel one under Rosetta: a
        # build that does not start (its signature, a library) fails here.
        if: always()
        run: |
          /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license
          target/release/rune --version
          arch -x86_64 target/x86_64-apple-darwin/release/rune --version

      - name: Install Go for the website
        if: always()
        # actions/setup-go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: Website/go.mod
          cache: false

      - name: Website
        # install.sh end to end with the LibreSSL macOS ships, not a newer openssl on PATH.
        if: always()
        run: |
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          openssl version
          (cd Website && go vet ./... && go test -count=1 ./...)

      - name: Save build cache
        if: always()
        # actions/cache v6.1.0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: macos-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}

      - name: Keep the binaries
        if: always()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rune-macos
          path: |
            target/release/rune
            target/x86_64-apple-darwin/release/rune
          if-no-files-found: warn
          retention-days: 14

  # The installers end to end on real machines, as a person runs them: the
  # binaries this run built, staged as a release signed with a key made for
  # this job only (Website/Tools/stage_test_release.py), served by the real
  # website, installed by install.sh or install.ps1, then started.
  installer-linux:
    name: Installer (Linux ${{ matrix.arch }} ${{ matrix.libc }})
    needs: linux-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04, libc: gnu }
          - { arch: x86_64, runner: ubuntu-24.04, libc: musl }
          - { arch: aarch64, runner: ubuntu-24.04-arm, libc: gnu }
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        # actions/checkout v6.1.0; immutable revision, no saved Git credential.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install Go for the website
        # actions/setup-go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: Website/go.mod
          cache: false

      - name: Fetch the build
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: rune-linux-${{ matrix.libc }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/build

      - name: Install through install.sh and start it
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          chmod 0755 "$RUNNER_TEMP/build/rune"
          python3 -I Website/Tools/stage_test_release.py --version "$version" --out "$RUNNER_TEMP/dl" \
            --build "linux-${{ matrix.arch }}-${{ matrix.libc }}=$RUNNER_TEMP/build/rune"
          (cd Website && go build -o "$RUNNER_TEMP/site" ./Server)
          printf '{"env":"Dev","basePath":"/Studio","origin":"http://127.0.0.1:18766","hosts":["127.0.0.1:18766"],"listen":["127.0.0.1:18766"],"health":"127.0.0.1:18768","downloads":"%s","indexing":false}\n' "$RUNNER_TEMP/dl" >"$RUNNER_TEMP/site.json"
          "$RUNNER_TEMP/site" --config "$RUNNER_TEMP/site.json" &
          for _ in $(seq 50); do curl -fsS -o /dev/null http://127.0.0.1:18766/Studio/ && break; sleep 0.2; done
          home="$RUNNER_TEMP/home"
          mkdir -p "$home"
          env -i HOME="$home" PATH=/usr/bin:/bin RUNE_LIBC=${{ matrix.libc }} sh -c 'curl -fsSL http://127.0.0.1:18766/Studio/install.sh | sh'
          test "$(env -i HOME="$home" RUNE_HOME="$home/rune" PATH=/usr/bin:/bin "$home/.local/bin/rune" --version)" = "rune $version"
          env -i HOME="$home" RUNE_HOME="$home/rune" PATH=/usr/bin:/bin "$home/.local/bin/rune" -config check
          test -f "$home/.local/share/runeagent/LICENSE.txt"

  installer-macos:
    name: Installer (macOS ${{ matrix.arch }})
    needs: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, runner: macos-15, path: release/rune }
          - { arch: x86_64, runner: macos-15-intel, path: x86_64-apple-darwin/release/rune }
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        # actions/checkout v6.1.0; immutable revision, no saved Git credential.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install Go for the website
        # actions/setup-go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: Website/go.mod
          cache: false

      - name: Fetch the builds
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: rune-macos
          path: ${{ runner.temp }}/build

      - name: Install through install.sh and start it
        # The system's own curl, tar and LibreSSL, as a fresh Mac has them.
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          chmod 0755 "$RUNNER_TEMP/build/release/rune" "$RUNNER_TEMP/build/x86_64-apple-darwin/release/rune"
          python3 -I Website/Tools/stage_test_release.py --version "$version" --out "$RUNNER_TEMP/dl" \
            --build "macos-aarch64=$RUNNER_TEMP/build/release/rune" \
            --build "macos-x86_64=$RUNNER_TEMP/build/x86_64-apple-darwin/release/rune"
          (cd Website && go build -o "$RUNNER_TEMP/site" ./Server)
          printf '{"env":"Dev","basePath":"/Studio","origin":"http://127.0.0.1:18766","hosts":["127.0.0.1:18766"],"listen":["127.0.0.1:18766"],"health":"127.0.0.1:18768","downloads":"%s","indexing":false}\n' "$RUNNER_TEMP/dl" >"$RUNNER_TEMP/site.json"
          "$RUNNER_TEMP/site" --config "$RUNNER_TEMP/site.json" &
          for _ in $(seq 50); do curl -fsS -o /dev/null http://127.0.0.1:18766/Studio/ && break; sleep 0.2; done
          home="$RUNNER_TEMP/home"
          mkdir -p "$home"
          env -i HOME="$home" PATH=/usr/bin:/bin:/usr/sbin:/sbin sh -c 'curl -fsSL http://127.0.0.1:18766/Studio/install.sh | sh' | tee "$RUNNER_TEMP/install.log"
          grep -q "for macOS $([ ${{ matrix.arch }} = aarch64 ] && echo 'Apple silicon' || echo Intel)" "$RUNNER_TEMP/install.log"
          test "$(env -i HOME="$home" RUNE_HOME="$home/rune" PATH=/usr/bin:/bin "$home/.local/bin/rune" --version)" = "rune $version"
          env -i HOME="$home" RUNE_HOME="$home/rune" PATH=/usr/bin:/bin "$home/.local/bin/rune" -config check
          test -f "$home/.local/share/runeagent/LICENSE.txt"

  installer-windows:
    name: Installer (Windows ${{ matrix.arch }}, ${{ matrix.shell }})
    needs: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: windows-2025, shell: powershell }
          - { arch: x86_64, runner: windows-2025, shell: pwsh }
          - { arch: aarch64, runner: windows-11-arm, shell: powershell }
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        # actions/checkout v6.1.0; immutable revision, no saved Git credential.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install Go for the website
        # actions/setup-go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: Website/go.mod
          cache: false

      - name: Fetch the builds
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: rune-windows
          path: ${{ runner.temp }}/build

      - name: Stage and serve the release
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          echo "RUNE_TEST_VERSION=$version" >> "$GITHUB_ENV"
          build="$(cygpath -u "$RUNNER_TEMP")/build"
          dl="$(cygpath -u "$RUNNER_TEMP")/dl"
          python -I Website/Tools/stage_test_release.py --version "$version" --out "$dl" \
            --build "windows-x86_64=$build/release/rune.exe" \
            --build "windows-aarch64=$build/aarch64-pc-windows-msvc/release/rune.exe"
          (cd Website && go build -o "$(cygpath -u "$RUNNER_TEMP")/site.exe" ./Server)
          printf '{"env":"Dev","basePath":"/Studio","origin":"http://127.0.0.1:18766","hosts":["127.0.0.1:18766"],"listen":["127.0.0.1:18766"],"health":"127.0.0.1:18768","downloads":"%s","indexing":false}\n' "$(cygpath -m "$dl")" >"$(cygpath -u "$RUNNER_TEMP")/site.json"
          "$(cygpath -u "$RUNNER_TEMP")/site.exe" --config "$(cygpath -w "$RUNNER_TEMP")\\site.json" > "$(cygpath -u "$RUNNER_TEMP")/site.log" 2>&1 &
          for _ in $(seq 50); do curl -fsS -o /dev/null http://127.0.0.1:18766/Studio/ && break; sleep 0.2; done
          curl -fsS -o /dev/null http://127.0.0.1:18766/Studio/install.ps1

      - name: Install through install.ps1 and start it
        # The shell is the matrix's: Windows PowerShell 5.1 or PowerShell 7.
        run: ${{ matrix.shell }} -NoProfile -NonInteractive -ExecutionPolicy Bypass -File Website/Tests/InstallerWindows.ps1

  # The files a visitor downloads today, installed on real machines and started:
  # install.sh on Linux and macOS, install.ps1 on Windows, all fetched from
  # atoryn.com. Dispatch only, so an outside outage can never fail an ordinary
  # push, and no secret, token or write permission is involved.
  installer-live:
    name: Published installer (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ci live]')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, kind: posix }
          - { os: macos-15, kind: posix }
          - { os: windows-2025, kind: windows }
    steps:
      - name: Install rune and start it (Linux and macOS)
        if: matrix.kind == 'posix'
        shell: bash
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/home"
          mkdir -p "$home"
          curl -fsSL https://atoryn.com/Studio/install.sh -o "$RUNNER_TEMP/install.sh"
          grep -q 'RuneAgent' "$RUNNER_TEMP/install.sh"
          latest="$(sed -n "s/^LATEST='\(.*\)'$/\1/p" "$RUNNER_TEMP/install.sh")"
          test -n "$latest" || { echo "the published installer names no release"; exit 1; }
          echo "published release: $latest"
          out="$RUNNER_TEMP/out.txt"
          env -i HOME="$home" PATH=/usr/bin:/bin TERM=dumb sh "$RUNNER_TEMP/install.sh" >"$out" 2>&1 ||
            { cat "$out"; exit 1; }
          got="$(env -i HOME="$home" RUNE_HOME="$home/rune" PATH=/usr/bin:/bin "$home/.local/bin/rune" --version)"
          test "$got" = "rune $latest" || { echo "installed '$got', published 'rune $latest'"; cat "$out"; exit 1; }
          echo "installed and started: $got"
          if grep -q 'is not on your PATH' "$out"; then
            grep -q 'export PATH=' "$out" || { echo "no one-line guidance printed"; cat "$out"; exit 1; }
            echo "::notice::no writable folder on PATH here; the one line was printed, as designed"
          else
            grep -q 'Ready\.' "$out" || { echo "neither ready nor a one line"; cat "$out"; exit 1; }
            command -v rune || { echo "claimed ready, but rune is not on PATH"; cat "$out"; exit 1; }
            echo "::notice::ready in the same window: $(command -v rune)"
          fi

          # The case a normal Mac (admin group owns /usr/local/bin) or a Homebrew
          # machine has: a writable folder already on PATH, so the installer can
          # leave the command ready in this very window.
          home2="$RUNNER_TEMP/home2"
          mkdir -p "$home2/bin"
          out2="$RUNNER_TEMP/out2.txt"
          env -i HOME="$home2" PATH="$home2/bin:/usr/bin:/bin" TERM=dumb sh "$RUNNER_TEMP/install.sh" >"$out2" 2>&1 ||
            { cat "$out2"; exit 1; }
          grep -q 'Ready\.' "$out2" || { echo "a writable PATH folder did not make it ready"; cat "$out2"; exit 1; }
          env -i HOME="$home2" PATH="$home2/bin:/usr/bin:/bin" sh -c 'command -v rune' | grep -qx "$home2/bin/rune" ||
            { echo "rune is not resolvable through the folder already on PATH"; cat "$out2"; exit 1; }
          echo "::notice::linked into a writable folder on PATH and resolvable in the same window"

      - name: Install rune and start it (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'bin'
          $env:RUNE_INSTALL_DIR = $dir
          irm https://atoryn.com/Studio/install.ps1 | iex
          if ($LASTEXITCODE -ne 0) { throw "installer exited $LASTEXITCODE" }
          $exe = Join-Path $dir 'rune.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "no rune.exe at $exe" }
          $version = (& $exe --version | Out-String).Trim()
          if ($version -notmatch '^rune \d+\.\d+\.\d+$') { throw "unexpected version: $version" }
          $onPath = @($env:PATH -split ';' | Where-Object { $_ -and $_.TrimEnd('\') -ieq $dir.TrimEnd('\') }).Count -gt 0
          if (-not $onPath) { throw "the installer did not add $dir to this window's PATH" }
          Write-Host "::notice::installed $version and this window resolves rune"
